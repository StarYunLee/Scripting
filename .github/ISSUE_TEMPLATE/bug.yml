name: Bug 反馈
description: 报告脚本报错、崩溃或与预期不符的行为。
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        请先搜索是否已有相同反馈，并确认正在使用的脚本版本。
        不确定的信息可以写“不确定”，不必为了填写反馈修改代码。
        **请勿上传 API Key、Token、Cookie、完整 OAuth 回调 URL、账号备份或其他敏感信息；截图和日志请先脱敏。**

  - type: input
    id: project
    attributes:
      label: 涉及的脚本项目
      placeholder: "例如：AI Usage / GitHub Stars / Icon Library / Surge Metrics"
    validations:
      required: true

  - type: input
    id: script_version
    attributes:
      label: 脚本版本
      description: 可从脚本的关于页、更新日志或 script.json 查看；找不到请写“不确定”。
      placeholder: "例如：1.8.0"
    validations:
      required: true

  - type: input
    id: scripting_version
    attributes:
      label: Scripting App 版本
      description: 请填写实际安装的版本；不知道请写“不确定”。
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 设备与 iOS / iPadOS 版本
      placeholder: "例如：iPhone 15 Pro / iOS 26.0"
    validations:
      required: true

  - type: dropdown
    id: entry
    attributes:
      label: 出问题的使用入口
      options:
        - App 内页面或直接运行脚本
        - 主屏幕 / 锁屏小组件
        - 快捷指令 / App Intent / 分享菜单
        - 其他或不确定（请在下面说明）
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: 实际发生了什么，预期应该怎样
      description: 请说清具体操作、错误表现和预期结果，不要只写“不能用”。
      placeholder: |
        实际结果：
        预期结果：
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从打开脚本或使用相关入口开始说明，并注明是否每次都会发生。
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
        复现频率：每次 / 偶尔 / 仅一次
    validations:
      required: true

  - type: textarea
    id: attachments
    attributes:
      label: 截图、错误信息或日志（可选）
      description: 可直接附图或填写相关错误片段。请先脱敏，不要附完整账号备份，也不要求提供脚本未支持的诊断文件。
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私检查
      options:
        - label: 我确认正文、截图和附件中不含密钥、Token、Cookie、完整 OAuth 回调 URL 或未脱敏的个人信息。
          required: true
